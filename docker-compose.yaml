
services:
  postgres:
    # Imagem com pgvector pré-instalado (Fase 3 / RAG).
    # Mesma base do postgres:15 + extensão `vector`.
    image: pgvector/pgvector:pg15
    container_name: jetsales_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jetsales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jetsales"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Broker do BullMQ (fila de ingestão assíncrona da Fase 3 / F3.2).
    image: redis:7-alpine
    container_name: jetsales_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    container_name: jetsales_backend
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env.docker
    volumes:
      - ./server:/app
      - /app/node_modules

  worker:
    # Consumer da fila de ingestão (parse → chunk → embed → knowledge_chunks).
    # Mesmo build do backend, mas roda o entrypoint do worker (processo separado
    # para que upload nunca bloqueie request).
    build: ./server
    container_name: jetsales_worker
    command: npm run worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env.docker
    volumes:
      - ./server:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
